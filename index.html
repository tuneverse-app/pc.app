<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tuneverse Alpha</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div id="fullPlayer" class="full-player">
        <div class="bg-blur"></div>
        <div class="player-content">
            <img id="fullCover" class="full-cover">
            <div class="song-info">
                <h1 id="fullTitle"></h1>
                <h3 id="fullArtist"></h3>
                <div class="controls">
                    <button id="fullPrev">⏮</button>
                    <button id="fullPlay">⏸</button>
                    <button id="fullNext">⏭</button>
                </div>
            </div>
        </div>
    </div>

    <aside class="sidebar">

        <div class="logo-container">

            <img
            src="assets/icons/logotv.PNG.png"
            alt="Tuneverse Logo"
            class="logo">

            <h1>TUNEVERSE</h1>

        </div>
        <button>  Inicio</button>
        <button>  Buscar</button>
        <button>  Biblioteca</button>
        <button>  Favoritos</button>
        <button>  Perfil</button>
    </aside>

    <main>
        <header>
            <h2>Tu música. Tu universo.</h2>

            <input type="text" id="search" placeholder="Buscar...">
        </header>

        <section>
            <h3>Tendencias</h3>
            <div id="songsContainer" class="songs"></div>
        </section>
    </main>

    <div class="player">
        <div class="player-left">
            <img id="cover" src="https://images.unsplash.com/photo-1614613535308-eb5fbd3d2c17?q=80&w=100" alt="">
            <div class="player-text">
                <h3 id="songTitle">Ninguna canción</h3>
                <p id="artistName">Selecciona una canción</p>
            </div>
        </div>

        <div class="player-controls">
            <button id="prevBtn" class="control-btn">⏮</button>
            <button id="playBtn" class="control-btn play-main">▶</button>
            <button id="nextBtn" class="control-btn">⏭</button>
        </div>
    </div>

    <audio id="audio"></audio>

    <script src="app.js"></script>
</body>
</html>
